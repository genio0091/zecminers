# Local development services. Production uses Neon (Postgres) + Upstash/Redis via Vercel.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zecminers
      POSTGRES_PASSWORD: zecminers
      POSTGRES_DB: zecminers_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zecminers"]
      interval: 5s
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: {}
