# Scheduled jobs for the Vercel Hobby plan (Vercel Cron there is limited to once a day).
# GitHub calls the app's /api/cron/<job> endpoints on schedule. Setup (once):
#   Settings → Secrets and variables → Actions
#     Secret   CRON_SECRET = the same value as CRON_SECRET in Vercel
#     Variable SITE_URL    = https://your-domain (no trailing slash)
# Every job is idempotent, so a late or repeated run is harmless.
name: Scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *" # invariants, payout-settle, raffle-close, chain-lag
    - cron: "7 * * * *" # balance-cache
    - cron: "17 * * * *" # pass-owners (soulbound check)
    - cron: "0 0 * * 1" # payout-cutoff — Monday 00:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options: [invariants, balance-cache, pass-owners, payout-cutoff, payout-settle, raffle-close, chain-lag]

permissions: {}

concurrency:
  group: scheduled-jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_JOB: ${{ inputs.job }}
    steps:
      - name: Call cron endpoints
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Set the SITE_URL variable and the CRON_SECRET secret to enable scheduled jobs."
            exit 0
          fi
          case "$SCHEDULE" in
            "*/5 * * * *") jobs="invariants payout-settle raffle-close chain-lag" ;;
            "7 * * * *")   jobs="balance-cache" ;;
            "17 * * * *")  jobs="pass-owners" ;;
            "0 0 * * 1")   jobs="payout-cutoff" ;;
            *)             jobs="$INPUT_JOB" ;;
          esac
          fail=0
          for job in $jobs; do
            code=$(curl -sS -o body.json -w '%{http_code}' --retry 2 --retry-delay 5 --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/$job") || code=000
            echo "$job → HTTP $code: $(head -c 400 body.json 2>/dev/null)"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
